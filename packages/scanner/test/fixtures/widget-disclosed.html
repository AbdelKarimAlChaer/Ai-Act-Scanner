<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>Beispiel Firma – Chat mit Disclosure</title></head>
<body>
  <h1>Beispiel Firma AG</h1>
  <p>Willkommen auf unserer Website. Wir beraten Sie gerne zu unseren Produkten.</p>

  <div id="intercom-container" role="dialog" aria-label="Chat">
    <div class="intercom-messenger-header">Chat</div>
    <div class="intercom-greeting">Hallo! Ich bin ein KI-Assistent und helfe Ihnen gerne weiter.</div>
    <input type="text" placeholder="Nachricht schreiben..." />
    <button>Senden</button>
  </div>

  <script>window.Intercom = function () {};</script>
</body>
</html>
